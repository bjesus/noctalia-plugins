id = "bjesus/ha-ma"
name = "Home Assistant & Music Assistant"
version = "1.0.0"
plugin_api = 9
author = "bjesus"
license = "MIT"
tags = ["bar", "panel", "service", "shortcut", "network", "indicator", "media"]
icon = "smart-home"
dependencies = ["xdg-open"]
description = "Monitor and control Home Assistant entities and Music Assistant from the bar and panels."

[[setting]]
key = "ha_url"
type = "string"
label_key = "settings.url.label"
description_key = "settings.url.description"
default = ""

[[setting]]
key = "ha_token"
type = "string"
label_key = "settings.token.label"
description_key = "settings.token.description"
default = ""

[[setting]]
key = "shortcut_entity_1"
type = "string"
label_key = "settings.shortcut_entity_1.label"
description_key = "settings.shortcut_entity.description"
default = ""

[[setting]]
key = "shortcut_entity_2"
type = "string"
label_key = "settings.shortcut_entity_2.label"
description_key = "settings.shortcut_entity.description"
default = ""

[[setting]]
key = "shortcut_entity_3"
type = "string"
label_key = "settings.shortcut_entity_3.label"
description_key = "settings.shortcut_entity.description"
default = ""

[[setting]]
key = "shortcut_entity_4"
type = "string"
label_key = "settings.shortcut_entity_4.label"
description_key = "settings.shortcut_entity.description"
default = ""

[[widget]]
id = "status"
entry = "widget.luau"

  [[widget.setting]]
  key = "show_entity_count"
  type = "bool"
  label_key = "settings.show_entity_count.label"
  default = false

[[widget]]
id = "music_status"
entry = "widget_music.luau"

  [[widget.setting]]
  key = "music_format"
  type = "string"
  label_key = "settings.music_format.label"
  description_key = "settings.music_format.description"
  default = "{title} - {artist}"

  [[widget.setting]]
  key = "music_target_speaker"
  type = "string"
  label_key = "settings.music_target_speaker.label"
  description_key = "settings.music_target_speaker.description"
  default = ""

# Native streaming background service maintaining a live connection to HA
[[service]]
id = "connection"
entry = "service_sse.luau"

[[shortcut]]
id = "ha_toggle_1"
entry = "shortcut.luau"

[[shortcut]]
id = "ha_toggle_2"
entry = "shortcut_2.luau"

[[shortcut]]
id = "ha_toggle_3"
entry = "shortcut_3.luau"

[[shortcut]]
id = "ha_toggle_4"
entry = "shortcut_4.luau"

[[shortcut]]
id = "ha_panel"
entry = "shortcut_panel.luau"

[[panel]]
id = "entity_manager"
entry = "panel.luau"
width = 520
height = 680
placement = "floating"
position = "center"

[[panel]]
id = "music"
entry = "panel_music.luau"
width = 520
height = 680
placement = "floating"
position = "center"
