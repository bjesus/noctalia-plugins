id = "bjesus/waybar-custom"
name = "Waybar Custom Commands"
version = "1.0.0"
plugin_api = 14
author = "bjesus"
license = "MIT"
tags = ["bar", "system", "indicator", "command"]
icon = "terminal"
description = "Run custom scripts and commands in the bar with full Waybar custom module compatibility."

[[widget]]
id = "custom"
entry = "widget.luau"

  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key = "exec"
  type = "string"
  label_key = "settings.exec.label"
  description_key = "settings.exec.description"
  default = ""

  [[widget.setting]]
  key = "exec_if"
  type = "string"
  label_key = "settings.exec_if.label"
  description_key = "settings.exec_if.description"
  default = ""

  [[widget.setting]]
  key = "interval"
  type = "int"
  label_key = "settings.interval.label"
  description_key = "settings.interval.description"
  default = 0
  min = 0
  max = 2147483647
  step = 1

  [[widget.setting]]
  key = "restart_interval"
  type = "int"
  label_key = "settings.restart_interval.label"
  description_key = "settings.restart_interval.description"
  default = 0
  min = 0
  max = 2147483647
  step = 1

  [[widget.setting]]
  key = "return_type"
  type = "string"
  label_key = "settings.return_type.label"
  description_key = "settings.return_type.description"
  default = ""

  [[widget.setting]]
  key = "format"
  type = "string"
  label_key = "settings.format.label"
  description_key = "settings.format.description"
  default = "{}"

  [[widget.setting]]
  key = "format_icons"
  type = "string"
  label_key = "settings.format_icons.label"
  description_key = "settings.format_icons.description"
  default = ""

  [[widget.setting]]
  key = "max_length"
  type = "int"
  label_key = "settings.max_length.label"
  description_key = "settings.max_length.description"
  default = 0
  min = 0
  max = 1000
  step = 1

  [[widget.setting]]
  key = "min_length"
  type = "int"
  label_key = "settings.min_length.label"
  description_key = "settings.min_length.description"
  default = 0
  min = 0
  max = 1000
  step = 1

  [[widget.setting]]
  key = "align"
  type = "string"
  label_key = "settings.align.label"
  description_key = "settings.align.description"
  default = "left"

  [[widget.setting]]
  key = "hide_empty_text"
  type = "bool"
  label_key = "settings.hide_empty_text.label"
  description_key = "settings.hide_empty_text.description"
  default = false

  [[widget.setting]]
  key = "escape"
  type = "bool"
  label_key = "settings.escape.label"
  description_key = "settings.escape.description"
  default = false

  [[widget.setting]]
  key = "exec_on_event"
  type = "bool"
  label_key = "settings.exec_on_event.label"
  description_key = "settings.exec_on_event.description"
  default = true

  [[widget.setting]]
  key = "tooltip"
  type = "bool"
  label_key = "settings.tooltip.label"
  description_key = "settings.tooltip.description"
  default = true

  [[widget.setting]]
  key = "tooltip_format"
  type = "string"
  label_key = "settings.tooltip_format.label"
  description_key = "settings.tooltip_format.description"
  default = ""

  [[widget.setting]]
  key = "on_click"
  type = "string"
  label_key = "settings.on_click.label"
  description_key = "settings.on_click.description"
  default = ""

  [[widget.setting]]
  key = "on_click_right"
  type = "string"
  label_key = "settings.on_click_right.label"
  description_key = "settings.on_click_right.description"
  default = ""

  [[widget.setting]]
  key = "on_click_middle"
  type = "string"
  label_key = "settings.on_click_middle.label"
  description_key = "settings.on_click_middle.description"
  default = ""

  [[widget.setting]]
  key = "on_scroll_up"
  type = "string"
  label_key = "settings.on_scroll_up.label"
  description_key = "settings.on_scroll_up.description"
  default = ""

  [[widget.setting]]
  key = "on_scroll_down"
  type = "string"
  label_key = "settings.on_scroll_down.label"
  description_key = "settings.on_scroll_down.description"
  default = ""

  [[widget.setting]]
  key = "on_update"
  type = "string"
  label_key = "settings.on_update.label"
  description_key = "settings.on_update.description"
  default = ""
